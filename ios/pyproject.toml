[project]
name = "openbachelor-ios"
version = "0.1.0"
description = "iOS host controller and TrollStore packager for OpenBachelorC"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "frida==17.9.1",
    "lief>=0.17.6,<0.18",
    "prompt-toolkit>=3.0.52,<4",
]

[project.scripts]
openbachelor-ios = "openbachelor_ios.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbachelor_ios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
